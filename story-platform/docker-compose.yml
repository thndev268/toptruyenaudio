version: '3.8'

services:
  # MongoDB Local Service (Phục vụ môi trường phát triển thử nghiệm nội bộ)
  mongodb:
    image: mongo:7.0
    container_name: story_platform_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: story_platform_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: story_platform_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/story_platform_db
      JWT_ACCESS_SECRET: dev_access_secret_key_change_in_prod
      JWT_REFRESH_SECRET: dev_refresh_secret_key_change_in_prod
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Next.js Frontend Web Application Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: story_platform_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongodb_data:
